services:
  - type: web
    name: tg-gif-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ADMIN_CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
